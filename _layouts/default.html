<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include google-tag-manager.html %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1f36">
    {% if page.layout == 'post' %}
      {% include post-seo.html %}
    {% else %}
      {% seo %}
    {% endif %}
    <link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% include structured-data.html %}
  </head>
  <body>
    {% include google-tag-manager-noscript.html %}
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
