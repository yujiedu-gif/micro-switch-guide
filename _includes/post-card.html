<article class="post-card">
  <p class="eyebrow">{{ include.post.category | default: 'Guide' }}</p>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 155 }}</p>
  <div class="post-meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %-d, %Y' }}</time>
    <span aria-hidden="true">·</span>
    <span>{{ include.post.content | number_of_words | divided_by: 220 | plus: 1 }} min read</span>
  </div>
</article>
